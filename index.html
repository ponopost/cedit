<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Famicom-style Icon Editor (HTML Canvas)</title>
<style>
  body {
    font-family: sans-serif;
    background: #f0f0f0;
    margin: 20px;
    user-select: none;
  }
  .container {
    display: flex;
    gap: 20px;
  }
  .left-panel, .right-panel {
    display: flex;
    flex-direction: column;
  }
  .right-panel {
    flex-grow: 1;
  }
  canvas {
    border: 1px solid #999;
    background: #e0e0e0;
    image-rendering: pixelated; /* ピクセルをくっきり表示 */
  }
  #editCanvas {
    width: 100%;
    max-width: 500px;
    height: auto;
    aspect-ratio: 1 / 1;
    cursor: crosshair;
  }
  .controls {
    margin-bottom: 8px;
  }
  .palette {
    display: grid;
    grid-template-columns: repeat(16, 24px);
    gap: 2px;
    margin-top: 10px;
  }
  .color-btn {
    width: 24px;
    height: 24px;
    border: 1px solid #555;
    cursor: pointer;
    box-sizing: border-box;
  }
  #indicator {
    margin-top: 8px;
    padding: 4px 8px;
    border: 2px solid #333;
    font-weight: bold;
    text-align: center;
    width: 120px;
  }
</style>
</head>
<body>

<h3>Famicom-style Icon Editor</h3>

<div class="controls">
  <button onclick="document.getElementById('fileInput').click()">Load PNG</button>
  <button onclick="document.getElementById('fileInput_bg').click()">Load ROM(BG)</button>
  <button onclick="document.getElementById('fileInput_sp').click()">Load ROM(SP)</button>
<br>
  <button onclick="saveImage('png')">Download PNG(128x128)</button>
  <button onclick="saveImageEdit('png')">Download PNG(16x16 or 32x32)</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
  <input type="file" id="fileInput_bg" accept="*/*" style="display:none" onchange="loadRom(event, 'BG')">
  <input type="file" id="fileInput_sp" accept="*/*" style="display:none" onchange="loadRom(event, 'SP')">
</div>

<div class="container">
  <!-- 左：全体マップ -->
  <div class="left-panel">
    <div>Char Map (8x8dots*256Chars)</div>
    <canvas id="mapCanvas" width="128" height="128"></canvas>
  </div>

  <!-- 右：拡大編集エリア -->
  <div class="right-panel">
    <div class="controls">
      Edit Size:
      <label><input type="radio" name="editSize" value="8" checked onchange="setSize(8)">8x8dots</label>
      <label><input type="radio" name="editSize" value="16" checked onchange="setSize(16)">16x16dots</label>
      <label><input type="radio" name="editSize" value="32" onchange="setSize(32)">32x32dots</label>
    </div>
    <div id="statusLabel">Pos: (0, 0) [16x16] | [WASD] Scroll | [Ctrl+C/V] Copy&Paste</div>
    <canvas id="editCanvas" width="320" height="320"></canvas>
  </div>
</div>

<!-- カラーパレット -->
<div>Color:</div>
<div class="palette" id="palette"></div>
<div id="indicator">選択色</div>

<script>
const TILE_PIXELS = 8;
const MAP_TILES = 16;
const MAP_SIZE = TILE_PIXELS * MAP_TILES; // 256px

// 64色パレット
const PALETTE = [
  "#000000","#404040","#808080","#c0c0c0","#ffffff","#ff0000","#00ff00","#0000ff",
  "#ffff00","#00ffff","#ff00ff","#ff8000","#800000","#008000","#000080","#808000",
  "#ff6666","#ff3333","#cc0000","#660000","#ffb266","#ff8000","#cc6600","#663300",
  "#ffcc99","#cc9966","#996633","#663300","#ffcccc","#ff99cc","#cc0066","#660033",
  "#ffff99","#ffff33","#cccc00","#666600","#ccff99","#99ff33","#66cc00","#336600",
  "#99ffcc","#33ff99","#00cc66","#006633","#99ffff","#33ffff","#00cccc","#006666",
  "#99ccff","#3399ff","#0066cc","#003366","#cc99ff","#9933ff","#6600cc","#330066",
  "#ff99ff","#ff33ff","#cc00cc","#6600cc","#e0e0e0","#a0a0a0","#606060","#202020"
];

// メイン画像データ (128x128 Offscreen Canvas)
const imgCanvas = document.createElement('canvas');
imgCanvas.width = MAP_SIZE;
imgCanvas.height = MAP_SIZE;
const imgCtx = imgCanvas.getContext('2d', { willReadFrequently: true });

// 状態
let selectedTileX = 0;
let selectedTileY = 0;
let editSize = 16;
let currentColor = "#000000";
let activePenColor = null;
let clipboardData = null;

// 要素取得
const editCanvas = document.getElementById('editCanvas');
const editCtx = editCanvas.getContext('2d');
const mapCanvas = document.getElementById('mapCanvas');
const mapCtx = mapCanvas.getContext('2d');

// --- パレット生成 ---
const paletteEl = document.getElementById('palette');
PALETTE.forEach(color => {
  const btn = document.createElement('div');
  btn.className = 'color-btn';
  btn.style.backgroundColor = color;
  btn.onclick = () => selectColor(color);
  paletteEl.appendChild(btn);
});

// 透明ボタン
const transBtn = document.createElement('div');
transBtn.className = 'color-btn';
transBtn.style.backgroundColor = '#fff';
transBtn.innerText = '透';
transBtn.style.textAlign = 'center';
transBtn.onclick = () => selectColor('transparent');
paletteEl.appendChild(transBtn);

function selectColor(color) {
  currentColor = color;
  const ind = document.getElementById('indicator');
  if (color === 'transparent') {
    ind.style.backgroundColor = '#fff';
    ind.style.color = '#888';
    ind.innerText = '透明';
  } else {
    ind.style.backgroundColor = color;
    ind.style.color = getBrightness(color) > 128 ? 'black' : 'white';
    ind.innerText = '選択色';
  }
}

function getBrightness(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return (r * 299 + g * 587 + b * 114) / 1000;
}

// --- 描画ロジック ---
function updateAll() {
  drawMap();
  drawEdit();
}

function drawMap() {
  mapCtx.fillStyle = "#e0e0e0";
  mapCtx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
  mapCtx.drawImage(imgCanvas, 0, 0);

  // 赤枠
  mapCtx.strokeStyle = "red";
  mapCtx.lineWidth = 1; // 128x128ではlineWidth=1の方が見やすいです
  mapCtx.strokeRect(selectedTileX * TILE_PIXELS, selectedTileY * TILE_PIXELS, editSize, editSize);
}

function drawEdit() {
  const scale = editCanvas.width / editSize;
  editCtx.clearRect(0, 0, editCanvas.width, editCanvas.height);

  // 市松模様＆ドット描画
  const basePx = selectedTileX * TILE_PIXELS;
  const basePy = selectedTileY * TILE_PIXELS;
  const imgData = imgCtx.getImageData(basePx, basePy, editSize, editSize).data;

  for (let py = 0; py < editSize; py++) {
    for (let px = 0; px < editSize; px++) {
      // 背景
      editCtx.fillStyle = (px + py) % 2 === 0 ? "#ffffff" : "#e0e0e0";
      editCtx.fillRect(px * scale, py * scale, scale, scale);

      // ドット
      const idx = (py * editSize + px) * 4;
      const alpha = imgData[idx + 3];
      if (alpha > 0) {
        editCtx.fillStyle = `rgba(${imgData[idx]}, ${imgData[idx+1]}, ${imgData[idx+2]}, ${alpha/255})`;
        editCtx.fillRect(px * scale, py * scale, scale, scale);
      }
    }
  }

  // グリッド線
  for (let i = 0; i <= editSize; i++) {
    const isThick = i % 8 === 0;
    editCtx.strokeStyle = isThick ? "#888888" : "#cccccc";
    editCtx.lineWidth = isThick ? 2 : 1;
    editCtx.beginPath();
    editCtx.moveTo(i * scale, 0);
    editCtx.lineTo(i * scale, editCanvas.height);
    editCtx.stroke();
    editCtx.beginPath();
    editCtx.moveTo(0, i * scale);
    editCtx.lineTo(editCanvas.width, i * scale);
    editCtx.stroke();
  }
}

// --- イベント処理 (MacPaint風トグル切り替え) ---
let isMouseDown = false;

editCanvas.addEventListener('mousedown', (e) => {
  isMouseDown = true;
  const rect = editCanvas.getBoundingClientRect();
  const scale = editCanvas.width / editSize;
  const px = Math.floor((e.clientX - rect.left) / (rect.width / editSize));
  const py = Math.floor((e.clientY - rect.top) / (rect.height / editSize));

  if (px >= 0 && px < editSize && py >= 0 && py < editSize) {
    const absX = selectedTileX * TILE_PIXELS + px;
    const absY = selectedTileY * TILE_PIXELS + py;
    const pixel = imgCtx.getImageData(absX, absY, 1, 1).data;

    // MacPaint風トグル判定
    if (pixel[3] > 0) {
      activePenColor = 'transparent'; // 消す
    } else {
      activePenColor = currentColor; // 塗る
    }
    setPixel(absX, absY, activePenColor);
  }
});

window.addEventListener('mousemove', (e) => {
  if (!isMouseDown || !activePenColor) return;
  const rect = editCanvas.getBoundingClientRect();
  const px = Math.floor((e.clientX - rect.left) / (rect.width / editSize));
  const py = Math.floor((e.clientY - rect.top) / (rect.height / editSize));

  if (px >= 0 && px < editSize && py >= 0 && py < editSize) {
    const absX = selectedTileX * TILE_PIXELS + px;
    const absY = selectedTileY * TILE_PIXELS + py;
    setPixel(absX, absY, activePenColor);
  }
});

window.addEventListener('mouseup', () => {
  isMouseDown = false;
  activePenColor = null;
});

mapCanvas.addEventListener('mousedown', (e) => {
  const rect = mapCanvas.getBoundingClientRect();

  // 画面上のクリック位置を 0.0 ～ 1.0 の比率に変換してから16分割(キャラ数)する
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  let tx = Math.floor((mouseX / rect.width) * MAP_TILES);
  let ty = Math.floor((mouseY / rect.height) * MAP_TILES);

  // 編集サイズ（16px=2キャラ分、32px=4キャラ分）に応じた端の溢れチェック
  const tilesPerEdit = editSize / TILE_PIXELS; // 16px選択時: 2キャラ分, 32px選択時: 4キャラ分
  const maxPos = MAP_TILES - tilesPerEdit;

  selectedTileX = Math.max(0, Math.min(tx, maxPos));
  selectedTileY = Math.max(0, Math.min(ty, maxPos));

  updateStatus();
  updateAll();
});

function setPixel(x, y, color) {
  if (color === 'transparent') {
    imgCtx.clearRect(x, y, 1, 1);
  } else {
    imgCtx.fillStyle = color;
    imgCtx.fillRect(x, y, 1, 1);
  }
  updateAll();
}

function setSize(size) {
  editSize = size;
  if (editSize === 32) {
    selectedTileX = Math.min(selectedTileX, MAP_TILES - 2);
    selectedTileY = Math.min(selectedTileY, MAP_TILES - 2);
  }
  updateStatus();
  updateAll();
}

function updateStatus() {
  document.getElementById('statusLabel').innerText =
    `Pos: (${selectedTileX.toString(16)}, ${selectedTileY.toString(16)}) [${editSize}x${editSize}] | [WASD] Scroll | [Ctrl+C/V] Copy&Paste`;
}

// --- キーボードショートカット (WASD / Ctrl+C / Ctrl+V) ---
window.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'c') {
    const bx = selectedTileX * TILE_PIXELS;
    const by = selectedTileY * TILE_PIXELS;
    clipboardData = imgCtx.getImageData(bx, by, editSize, editSize);
  } else if (e.ctrlKey && e.key === 'v') {
    if (clipboardData) {
      const bx = selectedTileX * TILE_PIXELS;
      const by = selectedTileY * TILE_PIXELS;
      imgCtx.putImageData(clipboardData, bx, by);
      updateAll();
    }
  } else if (['w', 'a', 's', 'd'].includes(e.key.toLowerCase())) {
    scrollArea(e.key.toLowerCase());
  }
});

function scrollArea(key) {
  const bx = selectedTileX * TILE_PIXELS;
  const by = selectedTileY * TILE_PIXELS;
  const srcData = imgCtx.getImageData(bx, by, editSize, editSize);
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = editSize;
  tempCanvas.height = editSize;
  const tCtx = tempCanvas.getContext('2d');
  tCtx.putImageData(srcData, 0, 0);

  imgCtx.clearRect(bx, by, editSize, editSize);

  if (key === 'w') { // 上
    imgCtx.drawImage(tempCanvas, 0, 1, editSize, editSize - 1, bx, by, editSize, editSize - 1);
    imgCtx.drawImage(tempCanvas, 0, 0, editSize, 1, bx, by + editSize - 1, editSize, 1);
  } else if (key === 's') { // 下
    imgCtx.drawImage(tempCanvas, 0, 0, editSize, editSize - 1, bx, by + 1, editSize, editSize - 1);
    imgCtx.drawImage(tempCanvas, 0, editSize - 1, editSize, 1, bx, by, editSize, 1);
  } else if (key === 'a') { // 左
    imgCtx.drawImage(tempCanvas, 1, 0, editSize - 1, editSize, bx, by, editSize - 1, editSize);
    imgCtx.drawImage(tempCanvas, 0, 0, 1, editSize, bx + editSize - 1, by, 1, editSize);
  } else if (key === 'd') { // 右
    imgCtx.drawImage(tempCanvas, 0, 0, editSize - 1, editSize, bx + 1, by, editSize - 1, editSize);
    imgCtx.drawImage(tempCanvas, editSize - 1, 0, 1, editSize, bx, by, 1, editSize);
  }
  updateAll();
}

// --- 入出力 ---
function saveImage(format) {
  const link = document.createElement('a');
  link.download = `icon_map.${format}`;
  link.href = imgCanvas.toDataURL(`image/${format}`);
  link.click();
}

function saveImageEdit(format) {
  // 1. 編集エリア用の16x16または32x32サイズのOffscreen Canvasを作成
  const cropCanvas = document.createElement('canvas');
  cropCanvas.width = editSize;  // 16 or 32
  cropCanvas.height = editSize; // 16 or 32
  const cropCtx = cropCanvas.getContext('2d');

  // 2. メイン画像(128x128)の選択エリアから切り出してコピー
  const srcX = selectedTileX * TILE_PIXELS;
  const srcY = selectedTileY * TILE_PIXELS;
  cropCtx.drawImage(
    imgCanvas,
    srcX, srcY, editSize, editSize, // 転送元 (X, Y, 幅, 高さ)
    0, 0, editSize, editSize        // 転送先 (X, Y, 幅, 高さ)
  );

  // 3. PNGとしてダウンロード出力
  const link = document.createElement('a');
  link.download = `tile_${editSize}x${editSize}_(${selectedTileX.toString(16)},${selectedTileY.toString(16)}).${format}`;
  link.href = cropCanvas.toDataURL(`image/${format}`);
  link.click();
}

function loadImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const img = new Image();
    img.onload = () => {
      imgCtx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);
      imgCtx.drawImage(img, 0, 0);
      updateAll();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

function loadRom(e, type) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    const bytes = new Uint8Array(evt.target.result);
    if (bytes.length >= 16) {
      // "NES" + 0x1A 魔法数のチェック
      const isNes = String.fromCharCode(bytes[0], bytes[1], bytes[2]) === "NES" && bytes[3] === 0x1a;
      if (isNes) {
        // PRG-ROMサイズ (16KB単位) & CHR-ROMサイズ (8KB単位)
        const prgPages = bytes[4];
        const chrPages = bytes[5];
        const prs = prgPages * 16384;
        const crs = chrPages * 8192;
        // alert(`PRG-ROM: ${prs} bytes (${prgPages} pages)\nCHR-ROM: ${crs} bytes (${chrPages} pages)`);

        // SP: +0バイト, BG: +4096バイト (+4KB)
        const subOffset = (type === 'SP') ? 0 : 4096;
        // CHR-ROM データの先頭オフセット（ヘッダー16バイト + PRG-ROMサイズ）
        const chrOffset = 16 + prs + subOffset;

        // BG面（最初の4KBまたは8KB）のデコード＆描画処理へ渡す
        parseChrToCanvas(bytes, chrOffset);

        // 描画
        updateAll();
      } else {
        alert("有効なNES ROMファイルではありません。");
      }
    } else {
      alert("ファイルサイズが小さすぎます。");
    }
  };

  // バイナリとして読み込む
  reader.readAsArrayBuffer(file);
}

function parseChrToCanvas(bytes, chrOffset) {
  // 描画前に一旦クリア
  imgCtx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);

  for (var col = 0; col < 16; col++) {     // col: 列 (横方向 0〜15)
    for (var row = 0; row < 16; row++) { // row: 行 (縦方向 0〜15)
      var tileNum = col * 16 + row;

      // 128x128ドット原寸での配置座標
      var x = col * 8;
      var y = row * 8;

      // 該当タイルの先頭バイト位置 (1タイル = 16バイト)
      var base = chrOffset + (tileNum * 16);

      // 8x8 ピクセルのデコード
      for (var j = 0; j < 8; j++) {
        var b1 = bytes[base + j];
        var b2 = bytes[base + j + 8];

        for (var i = 0; i < 8; i++) {
          // 最上位ビット(MSB)から順に取得するため (7 - i) ビットシフト
          var shift = 7 - i;
          var c1 = (b1 >> shift) & 1;
          var c2 = (b2 >> shift) & 1;
          var colorIdx = c1 + (c2 * 2); // 0〜3の2bppカラーインデックス

          // 簡易グレー表示
          var rgb = "#000000";
          if (colorIdx === 0) rgb = "#000000";
          if (colorIdx === 1) rgb = "#606060";
          if (colorIdx === 2) rgb = "#a0a0a0";
          if (colorIdx === 3) rgb = "#e0e0e0";

          // メインのOffscreen Canvas(imgCtx)に1ドット書き込み
          imgCtx.fillStyle = rgb;
          imgCtx.fillRect(x + i, y + j, 1, 1);
        }
      }
    }
  }
}

// 初期化
updateAll();
</script>
</body>
</html>
