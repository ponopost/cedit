<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Famicom-style Icon Editor (HTML Canvas)</title>
  <style>
    body { font-family: sans-serif; background: #f0f0f0; margin: 20px; user-select: none; }
    .container { display: flex; gap: 20px; }
    .left-panel, .right-panel { display: flex; flex-direction: column; }
    .right-panel { flex-grow: 1; }
    canvas { border: 1px solid #999; background: #e0e0e0; image-rendering: pixelated; }
    #editCanvas { width: 100%; max-width: 500px; height: auto; aspect-ratio: 1 / 1; cursor: crosshair; touch-action: none; }
    .controls { margin-bottom: 8px; }
    .controls button { margin-right: 4px; margin-bottom: 4px; padding: 4px 8px; cursor: pointer; }
    .palette { display: grid; grid-template-columns: repeat(16, 24px); gap: 2px; margin-top: 10px; }
    .color-btn { width: 24px; height: 24px; border: 1px solid #555; cursor: pointer; box-sizing: border-box; }
    .color-slots { display: flex; gap: 10px; margin-top: 10px; }
    .color-slot { padding: 6px 12px; border: 2px solid #333; font-weight: bold; cursor: pointer; border-radius: 4px; }
    #mapCanvas { image-rendering: pixelated; image-rendering: crisp-edges; width: 128px; height: 128px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h3>Famicom-style Icon Editor</h3>
  
  <div class="controls">
    <button onclick="document.getElementById('fileInput').click()">Load PNG</button>
    <button onclick="document.getElementById('fileInput_bg').click()">Load NES ROM(BG)</button>
    <button onclick="document.getElementById('fileInput_sp').click()">Load NES ROM(SP)</button>
    <button onclick="saveImage('png')">Download Map PNG(128x128)</button>
    <button onclick="saveImageEdit('png')">Download Edit PNG</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="loadImage(event)">
    <input type="file" id="fileInput_bg" accept="*/*" style="display:none" onchange="loadRom(event, 'BG')">
    <input type="file" id="fileInput_sp" accept="*/*" style="display:none" onchange="loadRom(event, 'SP')">
  </div>

  <div class="container">
    <!-- 左：全体マップ -->
    <div class="left-panel">
      <div>Char Map (8x8dots*256Chars)</div>
      <div>[WASD] Move Cursor</div>
      <canvas id="mapCanvas" width="128" height="128"></canvas>
    </div>

    <!-- 右：拡大編集エリア -->
    <div class="right-panel">
      <div class="controls">
        Edit Size:
        <label><input type="radio" name="editSize" value="8" onchange="setSize(8)">8x8</label>
        <label><input type="radio" name="editSize" value="16" checked onchange="setSize(16)">16x16</label>
        <label><input type="radio" name="editSize" value="32" onchange="setSize(32)">32x32</label>
      </div>

      <!-- スクロール & 変形操作ボタン -->
      <div class="controls">
        <span>Scroll: </span>
        <button onclick="scrollArea('w')">▲ Up</button>
        <button onclick="scrollArea('s')">▼ Down</button>
        <button onclick="scrollArea('a')">◀ Left</button>
        <button onclick="scrollArea('d')">▶ Right</button>
        <span style="margin-left: 10px;">Transform: </span>
        <button onclick="flipHorizontal()">⇄ 左右反転</button>
        <button onclick="flipVertical()">⇅ 上下反転</button>
        <button onclick="rotate90()">↻ 90度回転</button>
      </div>

      <div id="statusLabel">Pos: (0, 0) [16x16] | [Ctrl+C/V] Copy&Paste</div>
      <canvas id="editCanvas" width="320" height="320"></canvas>
    </div>
  </div>

  <!-- カラー選択エリア -->
  <div class="color-slots">
    <div id="indicator1" class="color-slot" onclick="setActiveSlot(1)">色1 (メイン)</div>
    <div id="indicator2" class="color-slot" onclick="setActiveSlot(2)">色2 (サブ/消し)</div>
  </div>
  <div class="palette" id="palette"></div>

  <script>
    const TILE_PIXELS = 8;
    const MAP_TILES = 16;
    const MAP_SIZE = TILE_PIXELS * MAP_TILES; // 128px

    const PALETTE = [
      "#000000","#404040","#808080","#c0c0c0","#ffffff","#ff0000","#00ff00","#0000ff",
      "#ffff00","#00ffff","#ff00ff","#ff8000","#800000","#008000","#000080","#808000",
      "#ff6666","#ff3333","#cc0000","#660000","#ffb266","#ff8000","#cc6600","#663300",
      "#ffcc99","#cc9966","#996633","#663300","#ffcccc","#ff99cc","#cc0066","#660033",
      "#ffff99","#ffff33","#cccc00","#666600","#ccff99","#99ff33","#66cc00","#336600",
      "#99ffcc","#33ff99","#00cc66","#006633","#99ffff","#33ffff","#00cccc","#006666",
      "#99ccff","#3399ff","#0066cc","#003366","#cc99ff","#9933ff","#6600cc","#330066",
      "#ff99ff","#ff33ff","#cc00cc","#6600cc","#e0e0e0","#a0a0a0","#606060","#202020"
    ];

    const imgCanvas = document.createElement('canvas');
    imgCanvas.width = MAP_SIZE;
    imgCanvas.height = MAP_SIZE;
    const imgCtx = imgCanvas.getContext('2d', { willReadFrequently: true });

    let selectedTileX = 0;
    let selectedTileY = 0;
    let editSize = 16;
    let clipboardData = null;

    // 2色トグル設定
    let color1 = "#000000";
    let color2 = "transparent";
    let activeSlot = 1;
    let drawModeColor = null;
    let isMouseDown = false;

    const editCanvas = document.getElementById('editCanvas');
    const editCtx = editCanvas.getContext('2d');
    const mapCanvas = document.getElementById('mapCanvas');
    const mapCtx = mapCanvas.getContext('2d');

    // --- パレット生成 ---
    const paletteEl = document.getElementById('palette');
    PALETTE.forEach(color => {
      const btn = document.createElement('div');
      btn.className = 'color-btn';
      btn.style.backgroundColor = color;
      btn.onclick = () => selectColor(color);
      paletteEl.appendChild(btn);
    });

    const transBtn = document.createElement('div');
    transBtn.className = 'color-btn';
    transBtn.style.backgroundColor = '#fff';
    transBtn.innerText = '透';
    transBtn.style.textAlign = 'center';
    transBtn.onclick = () => selectColor('transparent');
    paletteEl.appendChild(transBtn);

    function setActiveSlot(slot) {
      activeSlot = slot;
      updateColorIndicators();
    }

    function selectColor(color) {
      if (activeSlot === 1) color1 = color;
      else color2 = color;
      updateColorIndicators();
    }

    function updateColorIndicators() {
      const ind1 = document.getElementById('indicator1');
      const ind2 = document.getElementById('indicator2');

      ind1.style.backgroundColor = color1 === 'transparent' ? '#fff' : color1;
      ind1.style.color = (color1 === 'transparent' || getBrightness(color1) > 128) ? 'black' : 'white';
      ind1.style.border = activeSlot === 1 ? '3px solid red' : '2px solid #333';

      ind2.style.backgroundColor = color2 === 'transparent' ? '#fff' : color2;
      ind2.style.color = (color2 === 'transparent' || getBrightness(color2) > 128) ? 'black' : 'white';
      ind2.style.border = activeSlot === 2 ? '3px solid red' : '2px solid #333';
    }

    function getBrightness(hex) {
      if (hex === 'transparent') return 255;
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return (r * 299 + g * 587 + b * 114) / 1000;
    }

    // --- 描画処理 ---
    function updateAll() {
      drawMap();
      drawEdit();
    }

    function drawMap() {
      mapCtx.fillStyle = "#e0e0e0";
      mapCtx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
      mapCtx.drawImage(imgCanvas, 0, 0);
      mapCtx.strokeStyle = "red";
      mapCtx.lineWidth = 1;
      mapCtx.strokeRect(selectedTileX * TILE_PIXELS, selectedTileY * TILE_PIXELS, editSize, editSize);
    }

    function drawEdit() {
      const scale = editCanvas.width / editSize;
      editCtx.clearRect(0, 0, editCanvas.width, editCanvas.height);
      const basePx = selectedTileX * TILE_PIXELS;
      const basePy = selectedTileY * TILE_PIXELS;
      const imgData = imgCtx.getImageData(basePx, basePy, editSize, editSize).data;

      for (let py = 0; py < editSize; py++) {
        for (let px = 0; px < editSize; px++) {
          editCtx.fillStyle = (px + py) % 2 === 0 ? "#e8e8e8" : "#b8b8b8";
          editCtx.fillRect(px * scale, py * scale, scale, scale);

          const idx = (py * editSize + px) * 4;
          const alpha = imgData[idx + 3];
          if (alpha > 0) {
            editCtx.fillStyle = `rgba(${imgData[idx]}, ${imgData[idx+1]}, ${imgData[idx+2]}, ${alpha/255})`;
            editCtx.fillRect(px * scale, py * scale, scale, scale);
          }
        }
      }

      for (let i = 0; i <= editSize; i++) {
        const isThick = i % 8 === 0;
        editCtx.strokeStyle = isThick ? "#888888" : "#cccccc";
        editCtx.lineWidth = isThick ? 2 : 1;
        editCtx.beginPath();
        editCtx.moveTo(i * scale, 0);
        editCtx.lineTo(i * scale, editCanvas.height);
        editCtx.stroke();
        editCtx.beginPath();
        editCtx.moveTo(0, i * scale);
        editCtx.lineTo(editCanvas.width, i * scale);
        editCtx.stroke();
      }
    }

    // --- タッチ & マウス対応描画（MacPaint風トグル） ---
    function handlePointerStart(e) {
      isMouseDown = true;
      const rect = editCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const px = Math.floor((clientX - rect.left) / (rect.width / editSize));
      const py = Math.floor((clientY - rect.top) / (rect.height / editSize));

      if (px >= 0 && px < editSize && py >= 0 && py < editSize) {
        const absX = selectedTileX * TILE_PIXELS + px;
        const absY = selectedTileY * TILE_PIXELS + py;
        const pixel = imgCtx.getImageData(absX, absY, 1, 1).data;
        
        const curHex = pixel[3] === 0 ? 'transparent' : rgbToHex(pixel[0], pixel[1], pixel[2]);
        drawModeColor = (curHex === color1) ? color2 : color1;
        setPixel(absX, absY, drawModeColor);
      }
    }

    function handlePointerMove(e) {
      if (!isMouseDown || !drawModeColor) return;
      const rect = editCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const px = Math.floor((clientX - rect.left) / (rect.width / editSize));
      const py = Math.floor((clientY - rect.top) / (rect.height / editSize));

      if (px >= 0 && px < editSize && py >= 0 && py < editSize) {
        const absX = selectedTileX * TILE_PIXELS + px;
        const absY = selectedTileY * TILE_PIXELS + py;
        setPixel(absX, absY, drawModeColor);
      }
    }

    function handlePointerEnd() {
      isMouseDown = false;
      drawModeColor = null;
    }

    editCanvas.addEventListener('mousedown', handlePointerStart);
    editCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerStart(e); }, { passive: false });
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', (e) => { if(isMouseDown) e.preventDefault(); handlePointerMove(e); }, { passive: false });
    window.addEventListener('mouseup', handlePointerEnd);
    window.addEventListener('touchend', handlePointerEnd);

    mapCanvas.addEventListener('mousedown', (e) => {
      const rect = mapCanvas.getBoundingClientRect();
      let tx = Math.floor(((e.clientX - rect.left) / rect.width) * MAP_TILES);
      let ty = Math.floor(((e.clientY - rect.top) / rect.height) * MAP_TILES);
      const maxPos = MAP_TILES - (editSize / TILE_PIXELS);
      selectedTileX = Math.max(0, Math.min(tx, maxPos));
      selectedTileY = Math.max(0, Math.min(ty, maxPos));
      updateStatus();
      updateAll();
    });

    function setPixel(x, y, color) {
      if (color === 'transparent') {
        imgCtx.clearRect(x, y, 1, 1);
      } else {
        imgCtx.fillStyle = color;
        imgCtx.fillRect(x, y, 1, 1);
      }
      updateAll();
    }

    function setSize(size) {
      editSize = size;
      const maxPos = MAP_TILES - (editSize / TILE_PIXELS);
      selectedTileX = Math.min(selectedTileX, maxPos);
      selectedTileY = Math.min(selectedTileY, maxPos);
      updateStatus();
      updateAll();
    }

    function updateStatus() {
      document.getElementById('statusLabel').innerText = `Pos: (${selectedTileX.toString(16)}, ${selectedTileY.toString(16)}) [${editSize}x${editSize}] | [Ctrl+C/V] Copy&Paste`;
    }

    // --- キーボード操作 (WASD: マップカーソル移動) ---
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'c') {
        const bx = selectedTileX * TILE_PIXELS;
        const by = selectedTileY * TILE_PIXELS;
        clipboardData = imgCtx.getImageData(bx, by, editSize, editSize);
      } else if (e.ctrlKey && e.key === 'v') {
        if (clipboardData) {
          const bx = selectedTileX * TILE_PIXELS;
          const by = selectedTileY * TILE_PIXELS;
          imgCtx.putImageData(clipboardData, bx, by);
          updateAll();
        }
      } else if (['w', 'a', 's', 'd'].includes(e.key.toLowerCase())) {
        moveMapCursor(e.key.toLowerCase());
      }
    });

    function moveMapCursor(key) {
      const maxPos = MAP_TILES - (editSize / TILE_PIXELS);
      if (key === 'w') selectedTileY = Math.max(0, selectedTileY - 1);
      if (key === 's') selectedTileY = Math.min(maxPos, selectedTileY + 1);
      if (key === 'a') selectedTileX = Math.max(0, selectedTileX - 1);
      if (key === 'd') selectedTileX = Math.min(maxPos, selectedTileX + 1);
      updateStatus();
      updateAll();
    }

    // --- スクロール機能 ---
    function scrollArea(key) {
      const bx = selectedTileX * TILE_PIXELS;
      const by = selectedTileY * TILE_PIXELS;
      const srcData = imgCtx.getImageData(bx, by, editSize, editSize);
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = editSize;
      tempCanvas.height = editSize;
      tempCanvas.getContext('2d').putImageData(srcData, 0, 0);

      imgCtx.clearRect(bx, by, editSize, editSize);

      if (key === 'w') {
        imgCtx.drawImage(tempCanvas, 0, 1, editSize, editSize - 1, bx, by, editSize, editSize - 1);
        imgCtx.drawImage(tempCanvas, 0, 0, editSize, 1, bx, by + editSize - 1, editSize, 1);
      } else if (key === 's') {
        imgCtx.drawImage(tempCanvas, 0, 0, editSize, editSize - 1, bx, by + 1, editSize, editSize - 1);
        imgCtx.drawImage(tempCanvas, 0, editSize - 1, editSize, 1, bx, by, editSize, 1);
      } else if (key === 'a') {
        imgCtx.drawImage(tempCanvas, 1, 0, editSize - 1, editSize, bx, by, editSize - 1, editSize);
        imgCtx.drawImage(tempCanvas, 0, 0, 1, editSize, bx + editSize - 1, by, 1, editSize);
      } else if (key === 'd') {
        imgCtx.drawImage(tempCanvas, 0, 0, editSize - 1, editSize, bx + 1, by, editSize - 1, editSize);
        imgCtx.drawImage(tempCanvas, editSize - 1, 0, 1, editSize, bx, by, 1, editSize);
      }
      updateAll();
    }

    // --- 変形処理（反転・回転） ---
    function applyTransform(transformFn) {
      const bx = selectedTileX * TILE_PIXELS;
      const by = selectedTileY * TILE_PIXELS;
      const srcData = imgCtx.getImageData(bx, by, editSize, editSize);

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = editSize;
      tempCanvas.height = editSize;
      tempCanvas.getContext('2d').putImageData(srcData, 0, 0);

      const destCanvas = document.createElement('canvas');
      destCanvas.width = editSize;
      destCanvas.height = editSize;
      const dCtx = destCanvas.getContext('2d');

      transformFn(dCtx, tempCanvas);

      imgCtx.clearRect(bx, by, editSize, editSize);
      imgCtx.drawImage(destCanvas, bx, by);
      updateAll();
    }

    function flipHorizontal() {
      applyTransform((ctx, canvas) => {
        ctx.translate(editSize, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(canvas, 0, 0);
      });
    }

    function flipVertical() {
      applyTransform((ctx, canvas) => {
        ctx.translate(0, editSize);
        ctx.scale(1, -1);
        ctx.drawImage(canvas, 0, 0);
      });
    }

    function rotate90() {
      applyTransform((ctx, canvas) => {
        ctx.translate(editSize / 2, editSize / 2);
        ctx.rotate(90 * Math.PI / 180);
        ctx.drawImage(canvas, -editSize / 2, -editSize / 2);
      });
    }

    // --- 入出力 & ユーティリティ ---
    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function saveImage(format) {
      const link = document.createElement('a');
      link.download = `icon_map.${format}`;
      link.href = imgCanvas.toDataURL(`image/${format}`);
      link.click();
    }

    function saveImageEdit(format) {
      const cropCanvas = document.createElement('canvas');
      cropCanvas.width = editSize;
      cropCanvas.height = editSize;
      cropCanvas.getContext('2d').drawImage(
        imgCanvas,
        selectedTileX * TILE_PIXELS, selectedTileY * TILE_PIXELS, editSize, editSize,
        0, 0, editSize, editSize
      );
      const link = document.createElement('a');
      link.download = `tile_${editSize}x${editSize}_(${selectedTileX.toString(16)},${selectedTileY.toString(16)}).${format}`;
      link.href = cropCanvas.toDataURL(`image/${format}`);
      link.click();
    }

    function loadImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          imgCtx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);
          imgCtx.drawImage(img, 0, 0);
          updateAll();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function loadRom(e, type) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const bytes = new Uint8Array(evt.target.result);
        if (bytes.length >= 16) {
          const isNes = String.fromCharCode(bytes[0], bytes[1], bytes[2]) === "NES" && bytes[3] === 0x1a;
          if (isNes) {
            const prgPages = bytes[4];
            const prs = prgPages * 16384;
            const subOffset = (type === 'SP') ? 0 : 4096;
            const chrOffset = 16 + prs + subOffset;
            parseChrToCanvas(bytes, chrOffset);
            updateAll();
          } else {
            alert("Invalid NES ROM file.");
          }
        } else {
          alert("File size is too small.");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function parseChrToCanvas(bytes, chrOffset) {
      imgCtx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);
      for (let col = 0; col < 16; col++) {
        for (let row = 0; row < 16; row++) {
          let tileNum = col * 16 + row;
          let x = col * 8;
          let y = row * 8;
          let base = chrOffset + (tileNum * 16);
          for (let j = 0; j < 8; j++) {
            let b1 = bytes[base + j];
            let b2 = bytes[base + j + 8];
            for (let i = 0; i < 8; i++) {
              let shift = 7 - i;
              let c1 = (b1 >> shift) & 1;
              let c2 = (b2 >> shift) & 1;
              let colorIdx = c1 + (c2 * 2);
              let rgb = "#000000";
              if (colorIdx === 1) rgb = "#606060";
              if (colorIdx === 2) rgb = "#a0a0a0";
              if (colorIdx === 3) rgb = "#e0e0e0";
              imgCtx.fillStyle = rgb;
              imgCtx.fillRect(x + i, y + j, 1, 1);
            }
          }
        }
      }
    }

    // 初期化
    updateColorIndicators();
    updateAll();
  </script>
</body>
</html>
